[metadata]
name = xd2net
version = 0.1.0
description = XD2-Net: Inherently Explainable Process Outcome Prediction with Transformer backbone
author = XD2-Net Authors
python_requires = >=3.9

[options]
packages = find:
install_requires =
    torch>=2.1.0
    numpy>=1.24
    pandas>=2.0
    scikit-learn>=1.3
    pyyaml>=6.0
    matplotlib>=3.7
    seaborn>=0.13
    plotly>=5.17
    torchinfo>=1.8

[options.packages.find]
exclude =
    original*
    notebooks*
    tests*
    scripts*
